name: wbd-observability

services:
  lgtm:
    image: grafana/otel-lgtm:0.41.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/otel-lgtm/prometheus.yaml:ro
      - ./observability/collector.yml:/otel-lgtm/otelcol-config.yaml:ro
      - ./observability/provisioning.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/wbd.yaml:ro
      - ./observability/dashboard.json:/otel-lgtm/wbd/dashboards/migrations.json:ro
      - ./observability/logs:/var/log/wbd:ro
